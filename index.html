<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رافع ومولد روابط التحميل المباشرة</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    .box { border: 2px dashed #444; padding: 20px; margin: 20px auto; max-width: 500px; background: #1e1e1e; border-radius: 8px; }
    input[type="file"] { margin: 10px 0; }
    .file-item { background: #2a2a2a; padding: 10px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
    a.btn, button.btn-del { padding: 6px 12px; border-radius: 4px; text-decoration: none; border: none; cursor: pointer; }
    a.btn { background: #008cba; color: white; margin-left: 5px; }
    button.btn-del { background: #f44336; color: white; }
  </style>
</head>
<body>

  <h2>رفع ملف وإنشاء رابط تحميل مباشر</h2>

  <div class="box">
    <input type="file" id="fileInput">
    <button onclick="saveFile()" style="padding: 6px 15px; cursor: pointer;">حفظ الملف</button>
  </div>

  <div id="fileList" style="max-width: 500px; margin: 0 auto;"></div>

  <script>
    function displayFiles() {
      const fileList = document.getElementById('fileList');
      fileList.innerHTML = '';
      const stored = JSON.parse(localStorage.getItem('my_files') || '[]');
      
      stored.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span><b>${item.name}</b></span>
          <div>
            <a class="btn" href="${item.data}" download="${item.name}">تحميل مباشر</a>
            <button class="btn-del" onclick="deleteFile(${index})">حذف</button>
          </div>
        `;
        fileList.appendChild(div);
      });
    }

    function saveFile() {
      const input = document.getElementById('fileInput');
      if (!input.files[0]) return;

      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const stored = JSON.parse(localStorage.getItem('my_files') || '[]');
        stored.push({ name: file.name, data: e.target.result });
        localStorage.setItem('my_files', JSON.stringify(stored));
        input.value = '';
        displayFiles();
      };

      reader.readAsDataURL(file);
    }

    function deleteFile(index) {
      const stored = JSON.parse(localStorage.getItem('my_files') || '[]');
      stored.splice(index, 1);
      localStorage.setItem('my_files', JSON.stringify(stored));
      displayFiles();
    }

    displayFiles();
  </script>

</body>
</html>
