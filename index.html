
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>TRX</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#050505;
color:#fff;
}

html{
overflow-x:hidden;
overflow-y:auto;
scroll-behavior:smooth;
}

body{
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
overflow-x:hidden;
}

.scene{
position:relative;
isolation:isolate;
background:#080808;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}

.backdrop{
position:fixed;
inset:-2%;
width:104%;
height:104%;
object-fit:cover;
object-position:center center;
filter:brightness(.62) contrast(1.12) saturate(.9);
z-index:-3;
}

.shade{
position:fixed;
inset:0;
background:linear-gradient(
180deg,
rgba(0,0,0,.16),
rgba(0,0,0,.08) 45%,
rgba(0,0,0,.65)
);
z-index:-2;
pointer-events:none;
}

#snow{
position:fixed;
inset:0;
width:100%;
height:100%;
pointer-events:none;
z-index:3;
}



.center{
position:relative;
width:100%;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:28px 22px;
z-index:4;
}

.avatar-box{
position:relative;
width:min(190px,48vw);
height:min(190px,48vw);
margin-bottom:18px;
flex-shrink:0;
}

.avatar{
display:block;
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
filter:drop-shadow(0 12px 24px rgba(0,0,0,.5));
}

.avatar-badge{
position:absolute;
right:1px;
bottom:3px;
width:38px;
height:38px;
border-radius:50%;
background:#23d160;
border:5px solid rgba(30,30,33,.96);
box-shadow:0 0 0 2px rgba(35,209,96,.25),0 0 17px rgba(35,209,96,.75);
animation:onlinePulse 1.8s ease-in-out infinite;
}

@keyframes onlinePulse{
0%,100%{
box-shadow:0 0 0 2px rgba(35,209,96,.2),0 0 13px rgba(35,209,96,.55);
transform:scale(1);
}
50%{
box-shadow:0 0 0 7px rgba(35,209,96,0),0 0 25px rgba(35,209,96,.95);
transform:scale(1.06);
}
}

.name-line{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
}

.name{
font-size:clamp(31px,8vw,40px);
font-weight:800;
letter-spacing:-1.1px;
text-shadow:0 3px 18px rgba(0,0,0,.5);
}

.verified{
width:19px;
height:19px;
background:#f4f4f4;
color:#555;
border-radius:50%;
display:grid;
place-items:center;
font-size:17px;
font-weight:900;
}

.clock{
font-size:clamp(23px,6vw,30px);
font-weight:500;
letter-spacing:1.2px;
margin-top:18px;
text-shadow:0 3px 18px rgba(0,0,0,.7);
font-variant-numeric:tabular-nums;
}

.socials{
display:flex;
gap:12px;
margin-top:21px;
}

.social-btn{
width:44px;
height:44px;
border-radius:10px;
border:1px solid rgba(255,255,255,.35);
background:rgba(0,0,0,.45);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
display:grid;
place-items:center;
color:#fff;
text-decoration:none;
box-shadow:0 0 15px rgba(255,255,255,.13),inset 0 1px rgba(255,255,255,.12);
transition:.2s;
}

.social-btn:hover{
transform:translateY(-3px);
border-color:#fff;
box-shadow:0 0 22px rgba(255,255,255,.45);
}

.social-btn svg{
width:20px;
height:20px;
fill:currentColor;
}



.friends-section{
position:relative;
z-index:4;
width:min(650px,94%);
padding:30px 0 75px;
text-align:center;
}

.friends-title{
font-size:29px;
font-weight:900;
margin:0 0 30px;
color:#fff;
text-shadow:
0 0 8px #fff,
0 0 18px rgba(255,255,255,.8),
0 0 35px rgba(255,255,255,.4);
letter-spacing:1px;
}

.friends-grid{
display:grid;
grid-template-columns:1fr;
gap:24px;
}



.friend-card{
position:relative;
isolation:isolate;
display:flex;
align-items:center;
gap:14px;
padding:17px;
border-radius:19px;
background:#050505;
overflow:hidden;
}

.friend-card::before{
content:"";
position:absolute;
inset:-150%;
z-index:-2;
background:conic-gradient(
transparent 0deg,
transparent 230deg,
#777 270deg,
#fff 290deg,
#aaa 310deg,
transparent 340deg
);
animation:neonRotate 4s linear infinite;
}

.friend-card::after{
content:"";
position:absolute;
inset:2px;
border-radius:17px;
background:rgba(3,3,3,.98);
z-index:-1;
}

@keyframes neonRotate{
to{
transform:rotate(360deg);
}
}

.friend-card:hover{
box-shadow:
0 0 15px rgba(255,255,255,.7),
0 0 35px rgba(255,255,255,.25);
}


.friend-avatar{
width:65px;
height:65px;
flex-shrink:0;
object-fit:cover;
border-radius:50%;
border:2px solid #eee;
box-shadow:
0 0 10px rgba(255,255,255,.8),
0 0 22px rgba(255,255,255,.25);
background:#171717;
}



.friend-info{
flex:1;
min-width:0;
text-align:left;
}

.friend-name{
font-size:19px;
font-weight:900;
color:#fff;
text-shadow:0 0 10px rgba(255,255,255,.65);
}

.friend-username{
font-size:12px;
color:#aaa;
margin-top:7px;
overflow-wrap:anywhere;
}



.friend-link{
display:flex;
align-items:center;
justify-content:center;
gap:7px;
padding:10px 12px;
border-radius:12px;
color:white;
text-decoration:none;
white-space:nowrap;
font-size:12px;
font-weight:800;
background:rgba(255,255,255,.05);
border:1px solid #fff;
box-shadow:0 0 10px rgba(255,255,255,.4);
transition:.25s;
}

.friend-link:hover{
background:rgba(255,255,255,.15);
box-shadow:0 0 20px rgba(255,255,255,.8);
transform:scale(1.04);
}

.friend-link svg{
width:17px;
height:17px;
fill:none;
stroke:#fff;
stroke-width:2;
stroke-linecap:round;
stroke-linejoin:round;
flex-shrink:0;
}



@media(max-width:430px){

.center{
padding:22px 18px;
}

.friend-card{
gap:10px;
padding:13px;

.friend-avatar{
width:53px;
height:53px;

.friend-name{
font-size:16px;
}

.friend-link{
font-size:10px;
padding:9px 8px;
}

.friend-username{
font-size:10px;
}

}
</style>
</head>

<script>



const clock=document.getElementById("clock");

function tick(){

const now=new Date();

clock.textContent=now.toLocaleTimeString("en-US",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
});

}

tick();

setInterval(tick,1000);




const canvas=document.getElementById("snow");
const ctx=canvas.getContext("2d");

let width=0;
let height=0;
let dpr=1;
let flakes=[];

function resize(){

dpr=Math.min(window.devicePixelRatio||1,3);

width=window.innerWidth;
height=window.innerHeight;

canvas.width=Math.round(width*dpr);
canvas.height=Math.round(height*dpr);

canvas.style.width=width+"px";
canvas.style.height=height+"px";

ctx.setTransform(dpr,0,0,dpr,0,0);

ctx.imageSmoothingEnabled=true;

flakes=Array.from({
length:Math.min(220,Math.round(width/2.2))
},()=>({

x:Math.random()*width,
y:Math.random()*height,
r:Math.random()*2.4+.7,
speed:Math.random()*1.15+.35,
drift:(Math.random()-.5)*.55,
alpha:Math.random()*.55+.2,
blur:Math.random()>.72

}));

}

function draw(){

ctx.clearRect(0,0,width,height);

for(const f of flakes){

ctx.beginPath();

ctx.arc(f.x,f.y,f.r,0,Math.PI*2);

ctx.fillStyle="rgba(255,255,255,"+f.alpha+")";

if(f.blur){

ctx.shadowBlur=10;
ctx.shadowColor="rgba(255,255,255,.8)";

}else{

ctx.shadowBlur=0;

}

ctx.fill();

f.y+=f.speed;

f.x+=f.drift+Math.sin(f.y*.008)*.22;

if(f.y>height+8){
f.y=-8;
f.x=Math.random()*width;
}

if(f.x<-8)f.x=width+8;

if(f.x>width+8)f.x=-8;

}

ctx.shadowBlur=0;

requestAnimationFrame(draw);

}

window.addEventListener("resize",resize,{passive:true});

resize();

draw();

</script>
