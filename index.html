<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الاختراق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }

        
        .monitor {
            position: relative;
            width: 80vw;
            max-width: 900px;
            height: 55vw;
            max-height: 550px;
            background: #111;
            border: 20px solid #222;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }

        
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            border: 2px solid #333;
        }

        
        .screen::before {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        
        .stand {
            width: 160px;
            height: 50px;
            background: #1a1a1a;
            margin: 0 auto;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .base {
            width: 280px;
            height: 12px;
            background: #252525;
            margin: 0 auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div>
        <div class="monitor">
            <div class="screen">
                <canvas id="matrix"></canvas>
            </div>
        </div>
        <div class="stand"></div>
        <div class="base"></div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

       
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        const numbers = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

    
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = numbers.charAt(Math.floor(Math.random() * numbers.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);

    
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playHackingSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(Math.random() * 800 + 200, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        
        setInterval(playHackingSound, 100);

        
        window.addEventListener('click', () => audioCtx.resume());
        window.addEventListener('keydown', () => audioCtx.resume());
    </script>
</body>
</html>
