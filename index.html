<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>زر مع صوت فخم</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a;
            font-family: sans-serif;
        }

        .lux-button {
            padding: 15px 32px;
            font-size: 18px;
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.2s ease;
        }

        .lux-button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body>

    <button class="lux-button" onclick="playClickSound()">اضغط هنا</button>

    <script>
        // دالة لتوليد صوت كليك ناعم وفخم برمجياً
        function playClickSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine'; // موجة ناعمة
            osc.frequency.setValueAtTime(800, audioCtx.currentTime); // التردد الأول
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04); // انخفاض سريع للتردد لإعطاء ملمس الـ Click

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime); // مستوى الصوت (خفيف)
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04); // اختفاء الصوت بسرعة

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }
    </script>

</body>
</html>
