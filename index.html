<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مولد ونسخ روابط التحميل المباشرة</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
    .box { border: 2px dashed #444; padding: 20px; margin: 20px auto; max-width: 550px; background: #1e1e1e; border-radius: 8px; }
    input[type="text"] { width: 70%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
    .file-item { background: #2a2a2a; padding: 12px; margin: 10px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    button { padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
    .btn-copy { background: #4CAF50; color: white; margin-left: 5px; }
    .btn-del { background: #f44336; color: white; }
  </style>
</head>
<body>

  <h2>إضافة رابط ملف ونسخه بسهولة</h2>

  <div class="box">
    <input type="text" id="fileUrl" placeholder="ضع رابط الملف هنا (مثال: من Mega أو Gofile)">
    <button onclick="addLink()" style="background: #008cba; color: white;">إضافة الملف</button>
  </div>

  <div id="linksList" style="max-width: 550px; margin: 0 auto;"></div>

  <script>
    function displayLinks() {
      const list = document.getElementById('linksList');
      list.innerHTML = '';
      const stored = JSON.parse(localStorage.getItem('my_direct_links') || '[]');
      
      stored.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span style="word-break: break-all; max-width: 60%;">${item.url}</span>
          <div>
            <button class="btn-copy" onclick="copyToClipboard('${item.url}')">نسخ الرابط</button>
            <button class="btn-del" onclick="deleteLink(${index})">حذف</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function addLink() {
      const input = document.getElementById('fileUrl');
      const url = input.value.trim();
      if (!url) return;

      const stored = JSON.parse(localStorage.getItem('my_direct_links') || '[]');
      stored.push({ url: url });
      localStorage.setItem('my_direct_links', JSON.stringify(stored));
      input.value = '';
      displayLinks();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('تم نسخ الرابط بنجاح!');
      });
    }

    function deleteLink(index) {
      const stored = JSON.parse(localStorage.getItem('my_direct_links') || '[]');
      stored.splice(index, 1);
      localStorage.setItem('my_direct_links', JSON.stringify(stored));
      displayLinks();
    }

    displayLinks();
  </script>

</body>
</html>
