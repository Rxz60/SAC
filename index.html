<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ويب هوك تلقائي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#0b0a12;color:#f0ece4;min-height:100vh;display:flex;justify-content:center;align-items:center}
.bg-canvas{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 100% 70% at 20% 10%,rgba(212,168,83,0.06) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 80% 90%,rgba(139,92,246,0.05) 0%,transparent 60%),#0b0a12}
.container{position:relative;z-index:1;max-width:600px;width:100%;margin:20px;background:rgba(18,16,30,0.88);backdrop-filter:blur(12px);border:1px solid rgba(212,168,83,0.15);border-radius:28px;padding:30px 24px;box-shadow:0 20px 40px rgba(0,0,0,0.6)}
.title{font-weight:900;font-size:1.6rem;text-align:center;background:linear-gradient(135deg,#d4a853,#f0d080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{text-align:center;color:#a09988;font-size:.85rem;margin-bottom:20px}
.status{display:flex;justify-content:center;align-items:center;gap:8px;font-size:.85rem;color:#a09988;margin-bottom:18px}
.dot{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px rgba(74,222,128,0.7);animation:pulse 1.8s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
.label{color:#d4a853;font-weight:700}
.log-box{background:rgba(0,0,0,0.35);border-radius:16px;padding:12px;max-height:220px;overflow-y:auto;font-size:.75rem;border:1px solid rgba(212,168,83,0.12);margin-top:16px;direction:ltr;text-align:left;font-family:'Courier New',monospace;color:#a09988}
.log-box .entry{padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.log-box .entry .t{color:#d4a853}
.log-box .entry .ok{color:#4ade80}
.log-box .entry .fail{color:#f87171}
.preview{background:rgba(0,0,0,0.25);border-radius:14px;padding:14px;border-right:3px solid #d4a853;margin:12px 0}
.preview .msg{font-size:1.1rem;color:#f0ece4}
.preview .sub{font-size:.75rem;color:#a09988;margin-top:4px}
.count{display:flex;justify-content:space-between;font-size:.8rem;color:#a09988;margin-top:8px}
.count span{color:#d4a853;font-weight:700}
.watermark{position:fixed;bottom:12px;left:16px;color:rgba(255,255,255,0.02);font-size:.6rem;z-index:0;pointer-events:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d4a853;border-radius:10px}
</style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="container">
<div class="title"><i class="fa-solid fa-paper-plane" style="color:#d4a853;margin-left:8px;"></i> ويب هوك تلقائي</div>
<div class="sub">يرسل رسائل إلى ديسكورد تلقائياً</div>
<div class="status"><span class="dot"></span> <span>يعمل</span> <span style="color:#4a4458;margin:0 6px;">|</span> <span class="label" id="nextTime">—</span></div>
<div class="preview"><div class="msg" id="lastMsg">في انتظار الإرسال...</div><div class="sub" id="lastSub">—</div></div>
<div class="count"><span>📨 الإرسالات: <span id="sendCount">0</span></span><span>⏳ التالي: <span id="nextLabel">—</span></span></div>
<div class="log-box" id="logBox"><div class="entry"><span class="t">[—]</span> <span class="ok">جاري التهيئة...</span></div></div>
</div>
<div class="watermark">ويب هوك · 2026</div>
<script>
// ====== ضع رابط ويب هوك هنا ======
const WEBHOOK = "https://discord.com/api/webhooks/1545072432522723339/K01Kx-FYbVsafO6irjqFzWnXkuOGwkQa1vTBu28k2Z4T5L8VYuiWoC55-TDjYp0EVLY0";
// =================================

const logBox=document.getElementById('logBox');
const lastMsg=document.getElementById('lastMsg');
const lastSub=document.getElementById('lastSub');
const sendCountSpan=document.getElementById('sendCount');
const nextLabel=document.getElementById('nextLabel');
const nextTime=document.getElementById('nextTime');
let count=0;
let timer=null;
const INTERVAL=5;

function addLog(msg,type){
const d=document.createElement('div');d.className='entry';
const t=new Date().toLocaleTimeString('ar-EG');
const cls=type==='ok'?'ok':type==='fail'?'fail':'';
d.innerHTML='<span class="t">['+t+']</span> <span class="'+cls+'">'+msg+'</span>';
logBox.prepend(d);
if(logBox.children.length>30)logBox.removeChild(logBox.lastChild);
}

function updateNext(){
const now=new Date();
const next=new Date(now.getTime()+INTERVAL*1000);
const s=next.toLocaleTimeString('ar-EG');
nextLabel.textContent=s;
nextTime.textContent=s;
}

function getRandomMsg(){
const msgs=[
'🔥 تم إرسال رسالة جديدة',
'📡 تحديث فوري من الخادم',
'⚡ تنبيه عالي الأولوية',
'💀 نظام المراقبة نشط',
'✅ عملية ناجحة',
'🚀 تم التحديث بنجاح'
];
return msgs[Math.floor(Math.random()*msgs.length)];
}

function getRandomImage(){
return 'https://picsum.photos/seed/'+Math.floor(Math.random()*999)+'/600/300';
}

async function send(){
if(!WEBHOOK || WEBHOOK.includes('https://discord.com/api/webhooks/1545072432522723339/K01Kx-FYbVsafO6irjqFzWnXkuOGwkQa1vTBu28k2Z4T5L8VYuiWoC55-TDjYp0EVLY0')){
addLog('⚠️ عدل المتغير WEBHOOK في الكود','fail');
return;
}
const msg=getRandomMsg();
const payload={
content: msg + ' | ويب هوك تلقائي',
embeds:[{
title:'📨 رسالة تلقائية',
description:'تم الإرسال بنجاح عبر الويب هوك',
color:0xd4a853,
footer:{text:'MRX · 2026'},
image:{url:getRandomImage()},
timestamp:new Date().toISOString()
}]
};
try{
const res=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
if(res.ok){
count++;
sendCountSpan.textContent=count;
lastMsg.textContent=msg;
lastSub.textContent=new Date().toLocaleString('ar-EG');
addLog('✅ تم الإرسال ('+count+')','ok');
}else{
addLog('❌ فشل ('+res.status+')','fail');
}
}catch(e){
addLog('❌ خطأ: '+e.message,'fail');
}
}

function start(){
if(timer)clearInterval(timer);
addLog('▶️ بدء الإرسال كل '+INTERVAL+' ثانية','ok');
send();
timer=setInterval(function(){
send();
updateNext();
},INTERVAL*1000);
updateNext();
}

if(!WEBHOOK || WEBHOOK.includes('https://discord.com/api/webhooks/1545072432522723339/K01Kx-FYbVsafO6irjqFzWnXkuOGwkQa1vTBu28k2Z4T5L8VYuiWoC55-TDjYp0EVLY0')){
addLog('⚠️ عدل WEBHOOK في السطر الأول','fail');
}else{
start();
}
</script>
</body>
</html>
