<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRX · ويب هوك </title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0a12;--card:rgba(18,16,30,0.88);--gold:#d4a853;--primary:#8b5cf6;--accent:#00f2fe;--hi:#f0ece4;--mid:#a09988;--lo:#4a4458;--border:rgba(212,168,83,0.15);--shadow:0 20px 40px rgba(0,0,0,0.6)}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--hi);min-height:100vh;overflow-x:hidden}
.bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 100% 70% at 20% 10%,rgba(212,168,83,0.06) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 80% 90%,rgba(139,92,246,0.05) 0%,transparent 60%),var(--bg)}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;opacity:0;animation:twinkle var(--d,4s) var(--del,0s) ease infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0.4)}50%{opacity:var(--op,0.5);transform:scale(1)}}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);animation:drift var(--dt,14s) ease infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(var(--tx,40px), var(--ty,30px)) scale(var(--sc,1.1))}}
.container{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:60px;padding:12px 24px;margin-bottom:28px;box-shadow:var(--shadow)}
.header .brand{font-weight:900;font-size:1.3rem;background:linear-gradient(135deg,var(--gold),#f0d080);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .brand i{color:var(--gold);margin-left:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px rgba(74,222,128,0.6);display:inline-block;animation:pulse-dot 1.8s ease infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:28px;padding:22px 20px;box-shadow:var(--shadow);transition:all 0.3s}
.card:hover{border-color:rgba(212,168,83,0.25)}
.card-title{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#f0d080}
.card-title i{color:var(--gold)}
.form-group{margin-bottom:12px;text-align:right}
.form-group label{display:block;font-size:.8rem;font-weight:700;color:var(--mid);margin-bottom:3px}
.form-group input{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(0,0,0,0.3);color:var(--hi);font-size:.9rem;font-family:'Tajawal',sans-serif;transition:all 0.3s;text-align:right}
.form-group input:focus{border-color:var(--gold);outline:none}
.btn{padding:10px 24px;border:none;border-radius:60px;font-weight:900;font-size:.85rem;cursor:pointer;transition:all 0.3s;font-family:'Tajawal',sans-serif;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--gold),#b8923a);color:#0b0a12;box-shadow:0 4px 20px rgba(212,168,83,0.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,168,83,0.4)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 20px rgba(239,68,68,0.25)}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(239,68,68,0.4)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--hi)}
.btn-outline:hover{background:rgba(255,255,255,0.04);border-color:var(--gold)}
.log-box{background:rgba(0,0,0,0.3);border-radius:14px;padding:10px;max-height:180px;overflow-y:auto;font-size:.7rem;color:var(--mid);border:1px solid var(--border);margin-top:10px;direction:ltr;text-align:left;font-family:'Courier New',monospace}
.log-box .entry{padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.log-box .entry .t{color:var(--gold)}
.log-box .entry .ok{color:#4ade80}
.log-box .entry .fail{color:#f87171}
.log-box .entry .attack{color:#fbbf24}
.attack-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(0,0,0,0.2);border-radius:12px;border:1px solid var(--border);margin-bottom:6px}
.attack-item .ip{font-weight:800;color:var(--gold)}
.attack-item .status{font-size:.7rem;color:var(--mid)}
.attack-item .status.done{color:#4ade80}
.attack-item .status.running{color:#fbbf24}
.preview-box{background:rgba(0,0,0,0.2);border-radius:14px;padding:14px;border-right:3px solid var(--gold);margin-top:8px}
.preview-box .msg{font-size:1rem;color:var(--hi)}
.preview-box .sub{font-size:.75rem;color:var(--mid);margin-top:4px}
.watermark{position:fixed;bottom:12px;left:16px;color:rgba(255,255,255,0.02);font-size:.6rem;z-index:0}
.footer{text-align:center;color:var(--lo);font-size:.65rem;padding:16px 0 0;border-top:1px solid var(--border);margin-top:24px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}
</style>
</head>
<body>
<div class="bg-canvas"></div>
<div class="stars" id="stars"></div>
<div class="orb" style="width:500px;height:500px;top:-100px;right:-100px;background:radial-gradient(circle,rgba(212,168,83,0.06),transparent 70%);--dt:12s;--tx:60px;--ty:40px;--sc:1.1"></div>
<div class="orb" style="width:400px;height:400px;bottom:-80px;left:-80px;background:radial-gradient(circle,rgba(139,92,246,0.05),transparent 70%);--dt:16s;--tx:-50px;--ty:-30px;--sc:1.08"></div>
<div class="container">
<div class="header">
<div class="brand"><i class="fa-solid fa-skull"></i> MRX · ويب هوك</div>
<div><span class="status-dot"></span> <span style="color:var(--mid);font-size:.75rem;">يعمل</span></div>
</div>
<div class="grid-2">
<div>
<div class="card">
<div class="card-title"><i class="fa-solid fa-bullseye"></i> هجوم IP</div>
<div class="form-group"><label>🎯 أدخل IP الهدف</label><input type="text" id="targetIp" placeholder="مثال: 192.168.1.100"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="btn btn-danger" id="attackBtn"><i class="fa-solid fa-bomb"></i> شن هجوم</button>
<button class="btn btn-outline" id="stopAttackBtn"><i class="fa-solid fa-stop"></i> إيقاف</button>
</div>
<div id="attackLog" class="log-box"><div class="entry"><span class="t">[—]</span> <span class="ok">في انتظار الأوامر</span></div></div>
<div id="attackList" style="margin-top:8px;"></div>
</div>
<div class="card" style="margin-top:16px;">
<div class="card-title"><i class="fa-solid fa-clock"></i> إرسال ويب هوك تلقائي</div>
<div class="form-group"><label>⏱️ الفترة بالثواني</label><input type="number" id="intervalSec" value="5" min="1" max="60"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<button class="btn btn-primary" id="startWebhookBtn"><i class="fa-solid fa-play"></i> بدء الإرسال</button>
<button class="btn btn-outline" id="stopWebhookBtn"><i class="fa-solid fa-stop"></i> إيقاف</button>
</div>
<div style="display:flex;justify-content:space-between;font-size:.7rem;color:var(--mid);margin-top:6px;">
<span>📨 عدد الإرسالات: <span id="sendCount" style="color:var(--gold);">0</span></span>
<span>⏳ التالي: <span id="nextSend">—</span></span>
</div>
</div>
</div>
<div>
<div class="card">
<div class="card-title"><i class="fa-solid fa-receipt"></i> آخر رسالة مرسلة</div>
<div class="preview-box">
<div class="msg" id="lastMsg">—</div>
<div class="sub" id="lastSub">—</div>
</div>
<div id="webhookLog" class="log-box"><div class="entry"><span class="t">[—]</span> <span class="ok">جاري التجهيز...</span></div></div>
</div>
</div>
</div>
<div class="footer">© MRX 2026 — ويب هوك مهاجم</div>
</div>
<div class="watermark">MRX · 2026</div>
<script>
(function(){
// ============================================================
//  🎯 ضع رابط ويب هوك هنا
// ============================================================
const WEBHOOK_URL = "https://discord.com/api/webhooks/ضع_رابطك_هنا";
// ============================================================

const targetIp=document.getElementById('targetIp');
const attackBtn=document.getElementById('attackBtn');
const stopAttackBtn=document.getElementById('stopAttackBtn');
const attackLog=document.getElementById('attackLog');
const attackList=document.getElementById('attackList');
const intervalSec=document.getElementById('intervalSec');
const startWebhookBtn=document.getElementById('startWebhookBtn');
const stopWebhookBtn=document.getElementById('stopWebhookBtn');
const sendCountSpan=document.getElementById('sendCount');
const nextSendSpan=document.getElementById('nextSend');
const lastMsg=document.getElementById('lastMsg');
const lastSub=document.getElementById('lastSub');
const webhookLog=document.getElementById('webhookLog');

let attackInterval=null;
let webhookInterval=null;
let sendCount=0;
let isAttacking=false;
let attackTargets=[];

function log(el,msg,type='info'){
const entry=document.createElement('div');
entry.className='entry';
const time=new Date().toLocaleTimeString('ar-EG');
const cls=type==='ok'?'ok':type==='fail'?'fail':type==='attack'?'attack':'';
entry.innerHTML='<span class="t">['+time+']</span> <span class="'+cls+'">'+msg+'</span>';
el.prepend(entry);
if(el.children.length>30)el.removeChild(el.lastChild);
}

function updateNextSend(){
if(webhookInterval){
const now=new Date();
const sec=parseInt(intervalSec.value)||5;
const next=new Date(now.getTime()+sec*1000);
nextSendSpan.textContent=next.toLocaleTimeString('ar-EG');
}else{
nextSendSpan.textContent='—';
}
}

async function sendWebhook(){
if(!WEBHOOK_URL || WEBHOOK_URL.includes('https://discord.com/api/webhooks/1545072432522723339/K01Kx-FYbVsafO6irjqFzWnXkuOGwkQa1vTBu28k2Z4T5L8VYuiWoC55-TDjYp0EVLY0')){
log(webhookLog,'⚠️ عدل WEBHOOK_URL في الكود','fail');
return false;
}
const msgs=[
'🔥 تم شن هجوم على الهدف',
'💀 نظام الحماية تم اختراقه',
'⚡ تقدم الهجوم 100%',
'🔓 تم فتح الثغرة بنجاح',
'📡 بيانات الهدف تم سحبها',
'🚀 هجوم ناجح بفعالية',
];
const randomMsg=msgs[Math.floor(Math.random()*msgs.length)];
const payload={
content: randomMsg + ' | MRX Webhook',
embeds:[{
title:'🔥 هجوم ناجح',
description:'تم تنفيذ الهجوم على الهدف المحدد',
color:0xd4a853,
footer:{text:'MRX · 2026'},
timestamp:new Date().toISOString()
}]
};
try{
const res=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
if(res.ok){
sendCount++;
sendCountSpan.textContent=sendCount;
lastMsg.textContent=randomMsg;
lastSub.textContent= new Date().toLocaleString('ar-EG');
log(webhookLog,'✅ تم الإرسال ('+sendCount+')','ok');
return true;
}else{
log(webhookLog,'❌ فشل ('+res.status+')','fail');
return false;
}
}catch(e){
log(webhookLog,'❌ خطأ: '+e.message,'fail');
return false;
}
}

function startWebhookLoop(){
if(webhookInterval){clearInterval(webhookInterval);webhookInterval=null;}
const sec=parseInt(intervalSec.value)||5;
if(sec<1){alert('الفترة يجب أن تكون 1 ثانية على الأقل');return;}
log(webhookLog,'▶️ بدء الإرسال كل '+sec+' ثانية','ok');
sendWebhook();
webhookInterval=setInterval(function(){
sendWebhook();
updateNextSend();
},sec*1000);
updateNextSend();
startWebhookBtn.disabled=true;
stopWebhookBtn.disabled=false;
}

function stopWebhookLoop(){
if(webhookInterval){clearInterval(webhookInterval);webhookInterval=null;}
log(webhookLog,'⏹ توقف الإرسال','info');
nextSendSpan.textContent='—';
startWebhookBtn.disabled=false;
stopWebhookBtn.disabled=true;
}

function attackIP(ip){
if(!ip){log(attackLog,'❌ أدخل IP أولاً','fail');return;}
if(isAttacking){log(attackLog,'⚠️ هجوم قيد التنفيذ','fail');return;}
if(attackInterval){clearInterval(attackInterval);attackInterval=null;}
isAttacking=true;
attackBtn.disabled=true;
stopAttackBtn.disabled=false;
const target={ip:ip,start:Date.now(),status:'running'};
attackTargets.unshift(target);
renderAttackList();
log(attackLog,'🔥 بدء الهجوم على '+ip,'attack');
let counter=0;
attackInterval=setInterval(function(){
counter++;
const statuses=['🔍 فحص المنافذ...','📡 إرسال حزم SYN...','⚡ اختراق جدار الحماية...','💀 اختراق قاعدة البيانات...','✅ هجوم ناجح 100%'];
const st=statuses[counter%statuses.length];
log(attackLog,'['+counter+'] '+ip+' → '+st,'attack');
if(counter>=20){
clearInterval(attackInterval);
attackInterval=null;
isAttacking=false;
attackBtn.disabled=false;
stopAttackBtn.disabled=true;
target.status='done';
target.end=Date.now();
renderAttackList();
log(attackLog,'✅ اكتمل الهجوم على '+ip,'ok');
sendWebhook();
}
},300);
}

function stopAttack(){
if(attackInterval){clearInterval(attackInterval);attackInterval=null;}
isAttacking=false;
attackBtn.disabled=false;
stopAttackBtn.disabled=true;
log(attackLog,'⏹ تم إيقاف الهجوم','info');
if(attackTargets.length>0 && attackTargets[0].status==='running'){
attackTargets[0].status='stopped';
renderAttackList();
}
}

function renderAttackList(){
attackList.innerHTML='';
attackTargets.slice(0,5).forEach(function(t){
const div=document.createElement('div');
div.className='attack-item';
const statusText=t.status==='running'?'جاري 🔄':t.status==='done'?'✅ مكتمل':t.status==='stopped'?'⏹ متوقف':'';
const cls=t.status==='running'?'running':t.status==='done'?'done':'';
div.innerHTML='<span class="ip">'+t.ip+'</span> <span class="status '+cls+'">'+statusText+'</span>';
attackList.appendChild(div);
});
}

function init(){
const starsContainer=document.getElementById('stars');
for(let i=0;i<80;i++){
const s=document.createElement('div');s.className='star';
const size=Math.random()*2.5+0.5;
s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+size+'px;height:'+size+'px;--d:'+(2+Math.random()*5)+'s;--del:'+(Math.random()*6)+'s;--op:'+(0.3+Math.random()*0.5);
starsContainer.appendChild(s);
}
if(!WEBHOOK_URL || WEBHOOK_URL.includes('https://discord.com/api/webhooks/1545072432522723339/K01Kx-FYbVsafO6irjqFzWnXkuOGwkQa1vTBu28k2Z4T5L8VYuiWoC55-TDjYp0EVLY0')){
log(webhookLog,'⚠️ عدل WEBHOOK_URL في الكود','fail');
}else{
log(webhookLog,'✅ جاهز للإرسال','ok');
}
attackBtn.addEventListener('click',function(){attackIP(targetIp.value.trim());});
stopAttackBtn.addEventListener('click',stopAttack);
startWebhookBtn.addEventListener('click',startWebhookLoop);
stopWebhookBtn.addEventListener('click',stopWebhookLoop);
intervalSec.addEventListener('change',function(){
if(webhookInterval){stopWebhookLoop();startWebhookLoop();}
});
setInterval(updateNextSend,500);
stopAttackBtn.disabled=true;
stopWebhookBtn.disabled=true;
log(attackLog,'📌 أدخل IP واضغط "شن هجوم"','info');
log(webhookLog,'📌 اضغط "بدء الإرسال" للتشغيل التلقائي','info');
}

init();
})();
</script>
</body>
</html>
