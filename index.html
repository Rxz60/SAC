<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#030303;color:#fff;scroll-behavior:smooth}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.scene{position:fixed;inset:0;isolation:isolate;background:#050505;z-index:-4}
.backdrop{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;object-position:center center;filter:brightness(.45) contrast(1.2) saturate(.85);z-index:-3}
.shade{position:absolute;inset:0;background:radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%), linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.9));z-index:-2}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.wrapper{position:relative;z-index:4;width:100%;display:flex;flex-direction:column;align-items:center;padding:30px 15px;gap:35px}
.center{display:flex;align-items:center;flex-direction:column;text-align:center;padding:15px;margin-top:12vh}
.avatar-box{position:relative;width:105px;height:105px;margin-bottom:12px;flex-shrink:0}
.avatar{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:1px solid rgba(255,255,255,0.1);box-shadow:0 0 25px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,1)}
.avatar-badge{position:absolute;right:1px;bottom:2px;width:24px;height:24px;border-radius:50%;background:#23d160;border:3px solid #080808;box-shadow:0 0 10px rgba(35,209,96,.6);animation:onlinePulse 1.8s ease-in-out infinite}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 0 2px rgba(35,209,96,.2),0 0 8px rgba(35,209,96,.5);transform:scale(1)}50%{box-shadow:0 0 0 5px rgba(35,209,96,0),0 0 15px rgba(35,209,96,.9);transform:scale(1.05)}}
.name-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:0}
.name{font-size:24px;font-weight:800;letter-spacing:-0.5px;text-shadow:0 0 12px rgba(0,0,0,0.9), 0 0 5px rgba(255,255,255,0.2)}
.verified{width:15px;height:15px;background:#e1e1e1;color:#111;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900}
.clock{font-size:18px;font-weight:500;letter-spacing:1px;margin-top:10px;color:#ccc;text-shadow:0 0 10px rgba(0,0,0,1);font-variant-numeric:tabular-nums}
.socials{display:flex;gap:10px;margin-top:14px}
.social-btn{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(10,10,12,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;color:#eee;text-decoration:none;box-shadow:0 0 15px rgba(0,0,0,0.9);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.social-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3);box-shadow:0 0 20px rgba(0,0,0,1), 0 0 10px rgba(255,255,255,0.15)}
.social-btn svg{width:16px;height:16px;fill:currentColor}
/* مربع الأصدقاء نيـون أسود */
.friends-card{width:100%;max-width:340px;background:rgba(8,8,10,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(30,30,35,0.8);border-radius:14px;padding:16px;box-shadow:0 0 20px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,1), inset 0 0 15px rgba(0,0,0,0.8);margin-bottom:40px;transition:all 0.35s cubic-bezier(0.16, 1, 0.3, 1)}
.friends-card:hover{transform:translateY(-3px);border-color:rgba(80,80,95,0.6);box-shadow:0 0 30px rgba(0,0,0,1), 0 0 25px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0,0,0,0.9)}
.friends-title{font-size:14px;font-weight:700;margin:0 0 12px 0;text-align:center;color:#888;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:8px;text-shadow:0 0 8px rgba(0,0,0,1)}
.friend-item{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:8px 12px;margin-bottom:8px;transition:all 0.25s ease;box-shadow:inset 0 0 8px rgba(0,0,0,0.8)}
.friend-item:last-child{margin-bottom:0}
.friend-item:hover{background:rgba(15,15,18,0.8);border-color:rgba(255,255,255,0.15);transform:scale(1.01);box-shadow:0 0 12px rgba(0,0,0,1)}
.friend-id{font-family:monospace;font-size:11px;color:#aaa;letter-spacing:0.3px}
.transfer-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:rgba(15,15,20,0.9);border:1px solid rgba(40,40,45,0.9);border-radius:6px;color:#ddd;text-decoration:none;font-size:11px;font-weight:600;transition:all 0.25s ease;box-shadow:0 0 10px rgba(0,0,0,0.8)}
.transfer-btn:hover{background:#000;border-color:rgba(100,100,110,0.8);color:#fff;transform:scale(1.03);box-shadow:0 0 15px rgba(0, 0, 0, 1), 0 0 8px rgba(255,255,255,0.15)}
@media(max-width:600px){.center{margin-top:8vh}.friends-card{max-width:310px;padding:14px}}

<script>
    
setInterval(() => {
document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});
}, 1000);
document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", {hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true});

const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");
let dpr = Math.min(window.devicePixelRatio || 1, 3);
let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = Math.round(width * dpr);
canvas.height = Math.round(height * dpr);
canvas.style.width = width + "px";
canvas.style.height = height + "px";
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
let flakes = Array.from({length: Math.min(180, Math.round(width / 2.5))}, () => ({
x: Math.random() * width,
y: Math.random() * height,
r: Math.random() * 2 + .6,
speed: Math.random() * 1.1 + .3,
drift: (Math.random() - .5) * .5,
alpha: Math.random() * .5 + .2,
blur: Math.random() > .75
}));
window.addEventListener("resize", () => {
dpr = Math.min(window.devicePixelRatio || 1, 3);
width = window.innerWidth;
height = window.innerHeight;
canvas.width = Math.round(width * dpr);
canvas.height = Math.round(height * dpr);
canvas.style.width = width + "px";
canvas.style.height = height + "px";
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}, {passive: true});
setInterval(() => {
ctx.clearRect(0, 0, width, height);
for (const f of flakes) {
ctx.beginPath();
ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
ctx.fillStyle = "rgba(255,255,255," + f.alpha + ")";
if (f.blur) { ctx.shadowBlur = 8; ctx.shadowColor = "rgba(255,255,255,.7)"; } else { ctx.shadowBlur = 0; }
ctx.fill();
f.y += f.speed;
f.x += f.drift + Math.sin(f.y * .008) * .2;
if (f.y > height + 8) { f.y = -8; f.x = Math.random() * width; }
if (f.x < -8) f.x = width + 8;
if (f.x > width + 8) f.x = -8;
}
ctx.shadowBlur = 0;
}, 1000 / 60);
</script>
