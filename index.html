<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة حماية وتشفير سكربتات لوا - روبلوكس</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #00d26a;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 180px;
            background-color: #090d16;
            color: #38bdf8;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            direction: ltr;
            text-align: left;
        }

        .btn-container {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 210, 106, 0.3);
        }

        .copy-btn {
            background-color: #38bdf8;
            margin-top: 10px;
            font-size: 14px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة تشفير وحماية سكربتات لوا (Roblox)</h2>

    <!-- المربع الأول: إدخال الكود الأصلي -->
    <label for="inputLua">أدخل كود Lua الأصلي هنا:</label>
    <textarea id="inputLua" placeholder='print("Hello Roblox!")'></textarea>

    <!-- زر التشفير -->
    <div class="btn-container">
        <button onclick="obfuscateScript()">تشفير السكربت 🔒</button>
    </div>

    <!-- المربع الثاني: ظهور الكود المشفر -->
    <label for="outputLua">الكود المشفر (جاهز للاستخدام في روبلوكس):</label>
    <textarea id="outputLua" readonly placeholder="سيظهر السكربت المشفر هنا..."></textarea>
    
    <div style="text-align: left;">
        <button class="copy-btn" onclick="copyOutput()">نسخ السكربت المشفر 📋</button>
    </div>
</div>

<script>
function obfuscateScript() {
    const rawCode = document.getElementById('inputLua').value;
    
    if (!rawCode.trim()) {
        alert("يرجى كتابة أو لصق كود Lua أولاً!");
        return;
    }

    // 1. تحويل نص السكربت إلى مصفوفة قيم ASCII مفتاحية مع خانات عشوائية
    let byteTable = [];
    for (let i = 0; i < rawCode.length; i++) {
        byteTable.push(rawCode.charCodeAt(i));
    }

    // 2. توليد مفتاح تشفير عشوائي بسيط (XOR Key)
    const key = Math.floor(Math.random() * 200) + 20;
    const encryptedBytes = byteTable.map(b => b ^ key);

    // 3. بناء هيكل المحرك الخفيف والتنفيذي للوا في روبلوكس
    const obfuscatedTemplate = `--[[ 
    Protected by Roblox Lua Shield 
--]]
local _K = ${key}
local _D = {${encryptedBytes.join(',')}}
local _S = ""
for _i = 1, #_D do
    _S = _S .. string.char(bit32.bxor(_D[_i], _K))
end
local _f = assert(loadstring or load)(_S)
return _f()`;

    document.getElementById('outputLua').value = obfuscatedTemplate;
}

function copyOutput() {
    const output = document.getElementById('outputLua');
    if (!output.value) return;
    
    output.select();
    document.execCommand('copy');
    alert("تم نسخ السكربت المشفر بنجاح!");
}
</script>

</body>
</html>
