<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webhook Sender ⚡</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body { background:#0d0d14; color:#e0e0e0; min-height:100vh; padding:30px 15px; }
  .container { max-width:680px; margin:auto; }
  h1 { text-align:center; color:#7b5cff; margin-bottom:5px; }
  .sub { text-align:center; color:#888; margin-bottom:25px; font-size:14px; }
  .card { background:#16161f; border:1px solid #2a2a3a; border-radius:14px; padding:22px; margin-bottom:18px; }
  label { display:block; margin:12px 0 6px; color:#a89bff; font-size:13px; font-weight:600; }
  input, textarea, select { width:100%; background:#0d0d14; border:1px solid #33334a; color:#fff; border-radius:8px; padding:11px; font-size:14px; outline:none; }
  input:focus, textarea:focus { border-color:#7b5cff; }
  textarea { resize:vertical; min-height:80px; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .hint { font-size:11px; color:#666; margin-top:4px; }
  button { width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:15px; transition:.2s; }
  .send { background:linear-gradient(90deg,#7b5cff,#5c8aff); color:#fff; }
  .send:hover { opacity:.85; }
  .stop { background:#ff4757; color:#fff; margin-top:8px; display:none; }
  .stats { display:flex; gap:10px; margin-top:15px; }
  .stat { flex:1; background:#0d0d14; border-radius:10px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:22px; color:#7b5cff; }
  .stat span { font-size:11px; color:#888; }
  #log { margin-top:15px; max-height:180px; overflow-y:auto; background:#0d0d14; border-radius:10px; padding:10px; font-size:12px; font-family:monospace; direction:ltr; text-align:left; }
  .ok { color:#2ed573; } .err { color:#ff4757; }
  details { margin-top:12px; } summary { cursor:pointer; color:#a89bff; font-size:13px; }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Webhook Sender</h1>
  <p class="sub">أرسل رسائل متعددة بسرعة — تحكم كامل بالعدد والتوقيت</p>

  <div class="card">
    <label>🔗 رابط الويبهوك (Webhook URL)</label>
    <input id="url" placeholder="https://discord.com/api/webhooks/...">

    <div class="row">
      <div>
        <label>📨 عدد الرسائل</label>
        <input id="count" type="number" value="10" min="1">
      </div>
      <div>
        <label>⏱️ الفاصل بين كل رسالة (ثانية)</label>
        <input id="delay" type="number" value="0.5" step="0.1" min="0">
        <p class="hint">0 = أسرع سرعة ممكنة | 0.5 = نص ثانية</p>
      </div>
    </div>

    <label>💬 نص الرسالة</label>
    <textarea id="msg" placeholder="اكتب رسالتك هنا...">@here تم الإرسال ⚡</textarea>

    <details>
      <summary>🖼️ إضافة صورة / إيمبد (اختياري)</summary>
      <label>رابط الصورة (تظهر داخل الرسالة)</label>
      <input id="img" placeholder="https://example.com/image.png">
      <label>عنوان الإيمبد (Embed Title)</label>
      <input id="etitle" placeholder="عنوان الإيمبد">
      <label>وصف الإيمبد</label>
      <textarea id="edesc" placeholder="وصف الإيمبد"></textarea>
      <label>لون الإيمبد (HEX)</label>
      <input id="ecolor" type="color" value="#7b5cff">
    </details>

    <button class="send" id="btn" onclick="start()">🚀 ابدأ الإرسال</button>
    <button class="stop" id="stopBtn" onclick="stop()">⏹️ إيقاف</button>

    <div class="stats">
      <div class="stat"><b id="sSent">0</b><span>أُرسلت</span></div>
      <div class="stat"><b id="sFail">0</b><span>فشلت</span></div>
      <div class="stat"><b id="sTotal">0</b><span>الإجمالي</span></div>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
let running = false;

function log(txt, cls) {
  const l = document.getElementById('log');
  const d = document.createElement('div');
  d.className = cls || '';
  d.textContent = txt;
  l.prepend(d);
}

function buildPayload(msg) {
  const p = { content: msg };
  const img = document.getElementById('img').value.trim();
  const title = document.getElementById('etitle').value.trim();
  const desc = document.getElementById('edesc').value.trim();
  if (img) p.image = { url: img };
  if (title || desc) {
    const color = parseInt(document.getElementById('ecolor').value.slice(1), 16);
    p.embeds = [{ title, description: desc, color }];
  }
  return p;
}

async function sendOne(url, payload) {
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return r.status === 204 || r.ok;
  } catch (e) { return false; }
}

async function start() {
  const url = document.getElementById('url').value.trim();
  const count = parseInt(document.getElementById('count').value) || 1;
  const delay = (parseFloat(document.getElementById('delay').value) || 0) * 1000;
  const msg = document.getElementById('msg').value;
  const payload = buildPayload(msg);

  if (!url.startsWith('https://')) return log('❌ ضع رابط ويبهوك صحيح', 'err');

  running = true;
  document.getElementById('btn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('sTotal').textContent = count;

  for (let i = 1; i <= count && running; i++) {
    const ok = await sendOne(url, payload);
    if (ok) {
      document.getElementById('sSent').textContent = i;
      log(`✔ [${i}/${count}] تم الإرسال`, 'ok');
    } else {
      document.getElementById('sFail').textContent =
        parseInt(document.getElementById('sFail').textContent) + 1;
      log(`✖ [${i}/${count}] فشل (ربما Rate Limit)`, 'err');
    }
    if (delay > 0 && i < count) await new Promise(r => setTimeout(r, delay));
  }

  running = false;
  log('🏁 انتهى', 'ok');
  document.getElementById('btn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
}

function stop() { running = false; log('⏹ تم الإيقاف يدوياً', 'err'); }
</script>
</body>
</html>
